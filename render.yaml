# Render Blueprint for the YEBS Noodles Express app (site + API in one service).
# 1. Push this repo to GitHub.
# 2. Open https://render.com/deploy?repo=https://github.com/stephenbelemtuguri/yebsnoodles
#    or Render Dashboard -> New -> Blueprint -> pick this repo.
# 3. Press Apply. Render creates the web service AND a PostgreSQL database,
#    then injects DATABASE_URL automatically. No manual database key needed.
#
# The free plans are enough to test. Render's free PostgreSQL expires after
# 30 days; change both plans to starter/basic-256mb for production.
services:
  - type: web
    name: yebs-noodles
    runtime: node
    plan: free
    region: frankfurt
    buildCommand: npm install --omit=dev
    startCommand: node server.js
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: ADMIN_USERNAME
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      # Render injects the connection string of the database below.
      - key: DATABASE_URL
        fromDatabase:
          name: yebs-db
          property: connectionString
      # Optional: use Supabase instead of the Render database.
      - key: DATABASE_POOL_URL
        sync: false
      # Raw Supabase password. Overrides the password inside DATABASE_POOL_URL,
      # so @ : # / do not need URL-encoding.
      - key: DATABASE_PASSWORD
        sync: false
      - key: SUPABASE_URL
        value: https://dujmpwcarxliadnfdydr.supabase.co
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      # Render generates and persists this signing key for stable sessions.
      - key: YEBS_AUTH_SECRET
        generateValue: true
      - key: SUPABASE_STATE_TABLE
        value: yebs_state
      # Automatic WhatsApp kitchen alerts (optional).
      - key: WHATSAPP_TO
        value: "233559103452"
      - key: WHATSAPP_API_VERSION
        value: v20.0
      - key: WHATSAPP_TOKEN
        sync: false
      - key: WHATSAPP_PHONE_NUMBER_ID
        sync: false
      # Free CallMeBot relay fallback so the owner still gets order alerts when
      # the Cloud API is absent. The owner first sends
      # "I allow callmebot to send me messages" to +34 644 51 95 23 and puts the
      # resulting key here.
      - key: WHATSAPP_CALLMEBOT_APIKEY
        sync: false
      - key: WHATSAPP_CALLMEBOT_PHONE
        sync: false
      # Password recovery email providers.
      - key: SENDGRID_API_KEY
        sync: false
      - key: SENDGRID_FROM_EMAIL
        sync: false
      - key: SENDGRID_FROM_NAME
        value: YEBS Noodles
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_SECURE
        value: "false"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      # Password recovery SMS provider.
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_FROM_NUMBER
        sync: false
      # Optional: automatic MTN MoMo collection (sandbox or production).
      - key: MOMO_SUBSCRIPTION_KEY
        sync: false
      - key: MOMO_API_USER
        sync: false
      - key: MOMO_API_KEY
        sync: false
      - key: MOMO_CALLBACK_HOST
        sync: false
      - key: MOMO_TARGET_ENV
        value: mtnghana
      - key: MOMO_PAY_TO
        value: "0559103452"
      - key: MOMO_MERCHANT_NAME
        value: MATHEW TIA
      # Optional Android/iOS-assisted inbox bridge. Generate a random secret
      # of at least 32 characters and list only the official MoMo sender IDs.
      - key: MOMO_SMS_INGEST_TOKEN
        sync: false
      - key: MOMO_SMS_ALLOWED_SENDERS
        sync: false

databases:
  - name: yebs-db
    databaseName: yebs
    user: yebs
    plan: free
    region: frankfurt
