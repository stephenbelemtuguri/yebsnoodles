# Render Blueprint for the YEBS Noodles Express app (site + API in one service).
# 1. Push this repo to GitHub.
# 2. Open https://render.com/deploy?repo=https://github.com/stephenbelemtuguri/yebsnoodles
#    or Render Dashboard -> New -> Blueprint -> pick this repo.
# 3. Press Apply. Render creates the web service AND a PostgreSQL database,
#    then injects DATABASE_URL automatically. No manual database key needed.
#
# The free plans are enough to test. Render's free PostgreSQL expires after
# 30 days; change both plans to starter/basic-256mb for production.
services:
  - type: web
    name: yebs-noodles
    runtime: node
    plan: free
    region: frankfurt
    buildCommand: npm install --omit=dev
    startCommand: node server.js
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      # Render injects the connection string of the database below.
      - key: DATABASE_URL
        fromDatabase:
          name: yebs-db
          property: connectionString
      # Optional: use Supabase instead of the Render database.
      - key: DATABASE_POOL_URL
        sync: false
      # Raw Supabase password. Overrides the password inside DATABASE_POOL_URL,
      # so @ : # / do not need URL-encoding.
      - key: DATABASE_PASSWORD
        sync: false
      - key: SUPABASE_URL
        value: https://dujmpwcarxliadnfdydr.supabase.co
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SUPABASE_STATE_TABLE
        value: yebs_state
      # Automatic WhatsApp kitchen alerts (optional).
      - key: WHATSAPP_TO
        value: "233559103452"
      - key: WHATSAPP_API_VERSION
        value: v20.0
      - key: WHATSAPP_TOKEN
        sync: false
      - key: WHATSAPP_PHONE_NUMBER_ID
        sync: false
      # Optional: automatic MTN MoMo collection (sandbox or production).
      - key: MOMO_SUBSCRIPTION_KEY
        sync: false
      - key: MOMO_API_USER
        sync: false
      - key: MOMO_API_KEY
        sync: false
      - key: MOMO_CALLBACK_HOST
        sync: false
      - key: MOMO_TARGET_ENV
        value: mtnghana
      - key: MOMO_PAY_TO
        value: "0559103452"
      - key: MOMO_MERCHANT_NAME
        value: MATHEW TIA

databases:
  - name: yebs-db
    databaseName: yebs
    user: yebs
    plan: free
    region: frankfurt
